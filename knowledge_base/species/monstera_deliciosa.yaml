species_id: "monstera_deliciosa"
botanical_info:
  scientific_name: "Monstera deliciosa"
  persian_name: "برگ‌انجیری (مونسترا)"
  family: "Araceae"
  growth_rate: "moderate_to_fast"

tolerances:
  light_lux:
    min: 1500
    optimal_min: 2500
    optimal_max: 5000
    max_direct_sun_hours: 1
  humidity_pct:
    min: 40
    optimal: 65
  temp_celsius:
    min: 16
    optimal: 24
    max: 30

base_feeding:
  default_npk_ratio: "3-1-2 یا 20-20-20"
  standard_dose_ec: 1.2
  base_frequency_days: 14
  foliar_spray_compatible: true
  sensitive_to_chlorine: true

substrate_requirements:
  ideal_mix:
    label: "بستر سبک، هوادهی بالا و متخلخل (Aroid Mix)"
    recommended_composition: "پوست درخت ۴۰٪ + پیت‌ماس/کوکو ۳۰٪ + پرلیت درشت ۲۰٪ + زغال ۱۰٪"
  compatibility_rules:
    mineral_heavy:
      status: "dangerous"
      alert_message: "خاک سنگین و رسی باعث خفگی ریشه و پوسیدگی حتمی طوقه می‌شود."
      action_recommended: "تعویض گلدان و بستر (Repotting) در اولین فرصت."
      interim_care_plan: "آبیاری پس از خشک شدن ۷۰٪ خاک، کاهش دوز کود به ۵۰٪ همراه هیومیک اسید."
    inert_soilless:
      status: "acceptable"
      note: "مناسب با الزام مصرف مداوم Cal-Mag."
    aroid_chunky_mix:
      status: "ideal"
      note: "بهترین شرایط برای رشد و توسعه ریشه‌های هوایی."

phenology_constraints:
  fruiting_and_flowering:
    indoor_feasibility: "extremely_rare"
    is_fertilizer_driven_only: false
    mandatory_prerequisites:
      plant_maturity_years: 5
      minimum_climbing_height_meters: 3
      light_requirement: "نور فیلترشده بسیار قوی بالای ۵۰۰۰ لوکس"
      ambient_humidity_min_pct: 75
    advisory_strategy:
      action: "explain_prerequisites_first"
      warning: "مصرف بی‌رویه کود فسفر بالا در آپارتمان فقط باعث شوری بستر و سوختگی ریشه می‌شود."

common_disorders:
  root_rot:
    disorder_id: "root_rot"
    persian_name: "پوسیدگی ریشه و طوقه مونسترا"
    scientific_name: "Pythium spp. / Phytophthora spp."
    symptom_triggers:
      - "پوسیدگی"
      - "پوسیدگی ریشه یا طوقه (Root Rot)"
      - "پژمردگی"
      - "شل"
      - "سیاه"
    causative_factors: "ماندابی ناشی از آبیاری مکرر، زهکشی مسدود گلدان یا بستر سنگین رسی که با کاهش اکسیژن ریشه، شرایط فعالیت قارچ‌های بی‌هوازی را فراهم می‌کند."
    clinical_action_steps:
      - "خارج کردن فوری گیاه از گلدان و تکاندن ملایم بستر اطراف ریشه‌ها و شستشو با آب ولرم."
      - "هرس و جداسازی کامل کلیه ریشه‌های سیاه، لزج و قهوه‌ای با تیغ یا قیچی کاملاً ضدعفونی‌شده با الکل تا رسیدن به ریشه‌های سالم و سفید."
      - "ضدعفونی ریشه‌ها با غوطه‌وری ۱۰ دقیقه‌ای در محلول قارچ‌کش کاربندازیم (۱ در هزار) یا آب‌اکسیژنه ۳٪ (رقیق‌شده ۱ به ۴ با آب)."
      - "کاشت مجدد در گلدان تمیز و ضدعفونی‌شده دارای سوراخ‌های زهکش باز با بستر سبک و فوق‌العاده متخلخل Aroid Mix (پوسته درخت، پرلیت درشت، زغال و پیت‌ماس)."
      - "توقف کامل آبیاری برای ۴ تا ۵ روز اولیه تا زخم ریشه‌ها کالوس ببندد، سپس آبیاری محدود فقط پس از خشک شدن کامل لایه بالایی خاک."
      - "انتقال گلدان به مکانی با نور غیرمستقیم باکیفیت و گردش هوای ملایم؛ از آفتاب داغ مستقیم پرهیز شود."
    banned_actions:
      - "مصرف هرگونه کود شیمیایی یا مکمل تغذیه‌ای تا زمان احیای کامل ریشه‌ها (کوددهی به ریشه آسیب‌دیده منجر به سوختگی اسمزی و مرگ حتمی گیاه می‌شود)."
      - "آبیاری سنگین، مه‌پاشی بیش از حد یا استفاده از زیرگلدانی پر از آب راکد."
    repotting_required: true
    recommended_remedy: "قارچ‌کش سیستمیک کاربندازیم یا بنومیل / پراکسید هیدروژن ۳٪ رقیق"
    recovery_indicator: "توقف لکه‌های سیاه برگ، سفت شدن دمبرگ‌ها و آغاز رویش ریشه‌های سفید و برگ‌های جدید."

  fungal_leaf_spot:
    disorder_id: "fungal_leaf_spot"
    persian_name: "لکه‌های قارچی برگ مونسترا"
    scientific_name: "Alternaria / Colletotrichum"
    symptom_triggers:
      - "لکه"
      - "لکه‌های برگی (قارچی/باکتریایی)"
      - "قارچ"
      - "سوخته"
    causative_factors: "نشست قطرات آب روی برگ‌ها در اثر غبارپاشی مداوم، تهویه نامناسب محیط و تماس با قارچ‌های پاتوژن."
    clinical_action_steps:
      - "جدا کردن برگ‌ها یا بخش‌های دارای لکه‌های عمیق با ابزار استریل جهت جلوگیری از گسترش اسپورهای قارچ."
      - "قطع کامل مه‌پاشی و غبارپاشی مستقیم روی برگ‌های مونسترا."
      - "افزایش جریان و گردش ملایم هوا در اطراف گیاه."
      - "محلول‌پاشی یک‌نوبت قارچ‌کش حفاظتی مانکوزب یا اکسی‌کلرور مس با دوز استاندارد."
    banned_actions:
      - "محلول‌پاشی برگی کودها روی بافت‌های لکه‌دار و مرطوب نگه‌داشتن شاخ و برگ."
    repotting_required: false
    recommended_remedy: "قارچ‌کش حفاظتی مانکوزب یا اکسی‌کلرور مس"
    recovery_indicator: "توقف پیشروی لکه‌ها، تثبیت حاشیه‌ها و عدم ظهور لکه‌های جدید روی شاخسار نو."

  foliar_pests:
    disorder_id: "foliar_pests"
    persian_name: "آفات مکنده مونسترا (کنه تارعنکبوتی و شپشک)"
    scientific_name: "Tetranychidae / Pseudococcidae"
    symptom_triggers:
      - "کنه"
      - "کنه تارعنکبوتی (Spider Mites)"
      - "شپشک"
      - "شپشک آردآلود (Mealybugs)"
      - "آفت"
      - "مشاهده آفت و حشرات مضر"
    causative_factors: "هوای خشک آپارتمان، ضعف جریان هوا و ورود گیاه آلوده جدید بدون طی دوره قرنطینه."
    clinical_action_steps:
      - "ایزوله کردن فوری گلدان از سایر گیاهان منزل جهت ممانعت از سرایت آفت."
      - "تمیز کردن پشت و روی برگ‌ها و محل اتصال دمبرگ با پنبه آغشته به الکل رقیق یا محلول رقیق آب و صابون مایع."
      - "اسپری صابون حشره‌کش بیولوژیک (مانند پالیزین) یا کنه‌کش تخصصی (نئورون/انویدور) در هوای خنک عصر."
      - "تنظیم رطوبت نسبی محیط در بازه ۵۰ تا ۶۵ درصد جهت تضعیف شرایط زادآوری کنه‌ها."
    banned_actions:
      - "مصرف کودهای با نیتروژن بالا (نیتروژن زیاد بافت گیاه را ترد و مستعد تکثیر تصاعدی آفات مکنده می‌کند)."
    repotting_required: false
    recommended_remedy: "صابون حشره‌کش پتاسیمی (پالیزین) / روغن چریش / کنه‌کش تخصصی"
    recovery_indicator: "پاک شدن تارها و توده‌های سفید شپشک و بازگشت درخشش طبیعی به سطح برگ‌ها."
