species_id: "citrus_limon"
botanical_info:
  scientific_name: "Citrus limon"
  persian_name: "لیمو ترش"
  family: "Rutaceae"
  growth_rate: "moderate"

tolerances:
  light_lux:
    min: 4000
    optimal_min: 8000
    optimal_max: 20000
    max_direct_sun_hours: 8
  humidity_pct:
    min: 45
    optimal: 60
  temp_celsius:
    min: 10
    optimal: 22
    max: 32

base_feeding:
  default_npk_ratio: "18-18-18 یا 20-20-20 (همراه با آهن کلاته و روی)"
  standard_dose_ec: 1.6
  base_frequency_days: 10
  foliar_spray_compatible: true
  sensitive_to_chlorine: true

substrate_requirements:
  ideal_mix:
    label: "بستر سبک، با زهکشی بسیار بالا و غنی از مواد آلی (Citrus Mix)"
    recommended_composition: "پیت‌ماس ۴۰٪ + کمپوست/ورمی‌کمپوست ۲۰٪ + پرلیت/شن درشت ۳۰٪ + پوست درخت خرد شده ۱۰٪"
  compatibility_rules:
    mineral_heavy:
      status: "dangerous"
      alert_message: "خاک سنگین و رسی باعث خفگی ریشه، پوسیدگی طوقه (Phytophthora) و کلروز آهن شدید می‌شود."
      action_recommended: "اصلاح زهکشی و تعویض خاک به بستر سبک و شنی/پرلیتی در فصل بهار."
      interim_care_plan: "آبیاری منحصراً پس از خشک شدن ۵۰٪ عمق خاک، مصرف هیومیک اسید و محلول‌پاشی کلات آهن."
    inert_soilless:
      status: "acceptable"
      note: "مناسب به شرط افزودن مداوم کود کامل هیدروپونیک با کلات آهن Fe-EDDHA و کلسیم-منیزیم."
    citrus_well_drained:
      status: "ideal"
      note: "بهترین شرایط برای رشد رویشی، ریشه‌زایی عمیق و باردهی پایدار مرکبات."

phenology_constraints:
  fruiting_and_flowering:
    indoor_feasibility: "moderate_with_growlight"
    is_fertilizer_driven_only: false
    mandatory_prerequisites:
      plant_maturity_years: 2
      minimum_climbing_height_meters: 0
      light_requirement: "حداقل ۸۰۰۰ تا ۱۲۰۰۰ لوکس نور مستقیم یا لامپ رشد به مدت ۶ تا ۸ ساعت در روز"
      ambient_humidity_min_pct: 50
    advisory_strategy:
      action: "check_photoperiod_and_dormancy"
      warning: "گل‌انگیزی در لیمو ترش نیازمند دوره سرمای ملایم زمستانه (استراحت دمایی ۱۰ تا ۱۵ درجه) و نور شدید است؛ افزایش کود فسفر بالا به تنهایی محرک گل‌دهی نخواهد بود."

common_disorders:
  root_and_collar_rot:
    disorder_id: "root_and_collar_rot"
    persian_name: "پوسیدگی طوقه و ریشه لیمو ترش (گموز فیتوفتورایی)"
    scientific_name: "Phytophthora citrophthora / Phytophthora nicotianae"
    symptom_triggers:
      - "پوسیدگی"
      - "پوسیدگی ریشه یا طوقه (Root Rot)"
      - "صمغ"
      - "شل"
      - "سیاه"
    causative_factors: "تماس مداوم آب با پوست طوقه، سنگینی و غرقابی خاک رسی و زهکشی نامناسب کف گلدان."
    clinical_action_steps:
      - "کنار زدن خاک اطراف طوقه تا محل شروع ریشه‌های اصلی جهت هوا خوردن و خشک شدن تنه."
      - "تراشیدن بافت‌های قهوه‌ای و پوسیده تنه تا رسیدن به بافت سبز و زنده گیاه با کارد استریل."
      - "پانسمان محل زخم طوقه با خمیر بردوفیکس غلیظ یا اکسی‌کلرور مس."
      - "آبیاری پای بوته با قارچ‌کش متالاکسیل یا فوزتیل آلومینیوم (الیِت) با دوز استاندارد گیاه‌پزشکی."
      - "اصلاح زهکش و عدم تماس مستقیم آب آبیاری با طوقه در آینده."
    banned_actions:
      - "مصرف هرگونه کود شیمیایی پایه به خصوص کودهای نیتروژنه تا زمان التیام کامل زخم‌ها."
      - "غرقاب کردن مجدد خاک یا تماس شلنگ آب با تنه درخت."
    repotting_required: false
    recommended_remedy: "بردوفیکس / قارچ‌کش فوزتیل آلومینیوم (Aliette) یا متالاکسیل"
    recovery_indicator: "خشک شدن شیره و ترشحات صمغی، بسته شدن پوست طوقه و سبز ماندن شاخسار."

  iron_deficiency_chlorosis:
    disorder_id: "iron_deficiency_chlorosis"
    persian_name: "کلروز کمبود آهن مرکبات"
    scientific_name: "Iron Deficiency Chlorosis (Lime-induced)"
    symptom_triggers:
      - "زرد"
      - "زردی برگ (Chlorosis)"
    causative_factors: "قلیایی بودن خاک، آبیاری با آب سنگین حاوی بیکربنات و عدم جذب عنصر آهن در ریشه‌های مرکبات."
    clinical_action_steps:
      - "استفاده از کود آهن کلاته با کیفیت بر پایه EDDHA به صورت مصرف خاکی همراه با آب آبیاری."
      - "تنظیم pH آب آبیاری با مقادیر بسیار اندک اسید هیومیک یا اسید سیتریک خوراکی."
      - "بررسی خروج املاح مازاد با شستشوی دوره‌ای خاک."
    banned_actions:
      - "مصرف کودهای با فسفر بسیار بالا (فسفر اضافه مانع جذب ریشه‌ای آهن می‌شود)."
    repotting_required: false
    recommended_remedy: "کلات آهن Fe-EDDHA با درصد اورتو-اورتو بالا (مانند سکوسترین)"
    recovery_indicator: "سبز شدن تدریجی پهنک برگ‌های جوان بین رگبرگ‌ها."

  citrus_leafminer_and_scale:
    disorder_id: "citrus_leafminer_and_scale"
    persian_name: "مینوز و شپشک‌های مرکبات"
    scientific_name: "Phyllocnistis citrella / Diaspididae"
    symptom_triggers:
      - "آفت"
      - "مشاهده آفت و حشرات مضر"
      - "کنه"
      - "شپشک"
    causative_factors: "فعالیت لاروهای پروانه مینوز روی برگ‌های جوان بهاره/تابستانه مرکبات و تهویه ناکافی."
    clinical_action_steps:
      - "هرس سرشاخه‌های شدیداً پیچیده و آلوده به دالان‌های مینوز."
      - "محلول‌پاشی صابون آفت‌کش روغنی یا حشره‌کش سمپاشی ملایم (مانند آبامکتین یا کنفیدور) در ساعات بدون آفتاب."
      - "حفاظت از برگ‌های جوان در برابر باد و هوای راکد آلوده."
    banned_actions:
      - "سمپاشی در ساعات گرم آفتابی که باعث سوختگی بافت روغنی برگ‌های مرکبات می‌شود."
    repotting_required: false
    recommended_remedy: "حشره‌کش آبامکتین همراه با روغن ولک رقیق / صابون پتاسیمی"
    recovery_indicator: "رویش جست‌های جدید صاف، پهن و بدون دالان‌های مارپیچی."
